<!-- ==============================================================
     Sun on the sky cover (1600 x 900) - SMIL animation
   ============================================================== -->
<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" version="1.1">

    <!-- Sky background -->
    <rect width="100%" height="100%" fill="#8ce" />

    <!-- Sun - a little pulsing animation -->
    <g transform="translate(950,100)">
        <circle cx="0" cy="0" r="80" fill="#ee7">
            <animateTransform attributeName="transform" type="scale" values="1; 1.2; 1" dur="12s"
                repeatCount="indefinite" />
        </circle>
    </g>

</svg>
